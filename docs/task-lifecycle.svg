<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Brief, claim, checkpoint, complete with evidence</title>
  <desc id="desc">Task life cycle. A human approves a draft plan, which makes its tasks ready once their dependencies are done. A claim checks the tier and takes a 60-minute lease. Checkpoints renew the lease. Completion needs evidence. Block and unblock, release and lease expiry return the task to ready.</desc>
  <style>
    svg { --bg:#FFFFFF; --box:#F2F5F8; --line:#D3DCE4; --ink:#13202B; --muted:#56687A; --accent:#0B6E80; --human:#A84D17; --done:#2E7D32; --block:#B42318; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#152029; --box:#0E151B; --line:#2A3A46; --ink:#E4ECF2; --muted:#97A8B7; --accent:#5CC3D4; --human:#F2A266; --done:#6CC57A; --block:#F07A6E; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: var(--bg); }
    .t { fill: var(--ink); font-size: 15px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 12px; }
    .lab { fill: var(--muted); font-size: 11.5px; }
    .lab.h { fill: var(--human); font-weight: 600; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.3; }
    .box.acc { stroke: var(--accent); stroke-width: 1.8; }
    .box.hum { stroke: var(--human); stroke-width: 1.6; }
    .box.ok { stroke: var(--done); stroke-width: 1.6; }
    .box.bad { stroke: var(--block); stroke-width: 1.6; }
    .e { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .e.acc { stroke: var(--accent); }
    .e.hum { stroke: var(--human); }
    .ah { fill: var(--muted); } .aha { fill: var(--accent); } .ahh { fill: var(--human); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aha" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="1000" height="300" rx="12"/>

  <rect class="box hum" x="20" y="120" width="150" height="54" rx="8"/><text class="t" x="95" y="143" text-anchor="middle">Draft plan</text><text class="s" x="95" y="162" text-anchor="middle">agents may draft</text>
  <rect class="box" x="270" y="120" width="150" height="54" rx="8"/><text class="t" x="345" y="143" text-anchor="middle">Ready</text><text class="s" x="345" y="162" text-anchor="middle">dependencies done</text>
  <rect class="box acc" x="520" y="120" width="150" height="54" rx="8"/><text class="t" x="595" y="143" text-anchor="middle">Claimed</text><text class="s" x="595" y="162" text-anchor="middle">60-minute lease</text>
  <rect class="box ok" x="800" y="120" width="180" height="54" rx="8"/><text class="t" x="890" y="143" text-anchor="middle">Completed</text><text class="s" x="890" y="162" text-anchor="middle">needs evidence</text>
  <rect class="box bad" x="520" y="232" width="150" height="54" rx="8"/><text class="t" x="595" y="255" text-anchor="middle">Blocked</text><text class="s" x="595" y="274" text-anchor="middle">reason recorded</text>

  <path class="e hum" d="M170 147 H268" marker-end="url(#ahh)"/><text class="lab h" x="220" y="138" text-anchor="middle">human approves</text>
  <path class="e" d="M420 147 H518" marker-end="url(#ah)"/><text class="lab" x="470" y="138" text-anchor="middle">claim</text><text class="lab" x="470" y="166" text-anchor="middle">tier check</text>
  <path class="e acc" d="M670 147 H798" marker-end="url(#aha)"/><text class="lab" x="735" y="138" text-anchor="middle">complete</text><text class="lab" x="735" y="166" text-anchor="middle">with evidence</text>
  <path class="e acc" d="M625 120 C625 80 665 80 662 118" marker-end="url(#aha)"/><text class="lab" x="648" y="72" text-anchor="middle">checkpoint renews lease</text>
  <path class="e" d="M560 120 C545 74 420 74 402 118" marker-end="url(#ah)"/><text class="lab" x="480" y="68" text-anchor="middle">release · lease expires</text>
  <path class="e" d="M595 174 V230" marker-end="url(#ah)"/><text class="lab" x="605" y="207">block</text>
  <path class="e" d="M520 259 H345 V176" marker-end="url(#ah)"/><text class="lab" x="432" y="251" text-anchor="middle">unblock</text>
</svg>
