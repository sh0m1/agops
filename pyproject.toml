[project]
name = "agent-hub"
version = "0.2.0"
description = "Git-native shared knowledge and planning for local coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.12,<2",
  "PyYAML>=6,<7",
]

[project.scripts]
agops = "agent_hub.cli:main"
agops-mcp = "agent_hub.mcp_server:main"
agent-hub = "agent_hub.cli:main"
agent-hub-mcp = "agent_hub.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
